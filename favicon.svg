<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>缠中说禅</title>
  
  <!-- 简 易莲花素描 -->
  <g fill="none" stroke="#c41e3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 中心莲蓬 -->
    <circle cx="32" cy="32" r="3" fill="#c41e3a"/>
    
    <!-- 8片花瓣 -->
    <ellipse cx="32" cy="18" rx="4" ry="10"/>
    <ellipse cx="44" cy="22" rx="4" ry="10" transform="rotate(45 44 22)"/>
    <ellipse cx="46" cy="32" rx="4" ry="10" transform="rotate(90 46 32)"/>
    <ellipse cx="44" cy="42" rx="4" ry="10" transform="rotate(135 44 42)"/>
    <ellipse cx="32" cy="46" rx="4" ry="10"/>
    <ellipse cx="20" cy="42" rx="4" ry="10" transform="rotate(45 20 42)"/>
    <ellipse cx="18" cy="32" rx="4" ry="10" transform="rotate(90 18 32)"/>
    <ellipse cx="20" cy="22" rx="4" ry="10" transform="rotate(135 20 22)"/>
    
    <!-- 花瓣脉络 -->
    <line x1="32" y1="22" x2="32" y2="29" stroke-width="0.8" opacity="0.5"/>
    <line x1="40" y1="25" x2="35" y2="30" stroke-width="0.8" opacity="0.5"/>
    <line x1="42" y1="32" x2="35" y2="32" stroke-width="0.8" opacity="0.5"/>
    <line x1="40" y1="39" x2="35" y2="34" stroke-width="0.8" opacity="0.5"/>
    <line x1="32" y1="42" x2="32" y2="35" stroke-width="0.8" opacity="0.5"/>
    <line x1="24" y1="39" x2="29" y2="34" stroke-width="0.8" opacity="0.5"/>
    <line x1="22" y1="32" x2="29" y2="32" stroke-width="0.8" opacity="0.5"/>
    <line x1="24" y1="25" x2="29" y2="30" stroke-width="0.8" opacity="0.5"/>
    
    <!-- 水波纹 -->
    <path d="M20 54 Q32 52 44 54" stroke-width="1" opacity="0.3"/>
    <path d="M16 58 Q32 56 48 58" stroke-width="1" opacity="0.2"/>
  </g>
</svg>